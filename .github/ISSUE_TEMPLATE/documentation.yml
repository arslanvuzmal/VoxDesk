name: Documentation correction
description: Report an inaccurate, stale, unclear, or broken document.
title: "docs: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Document or link
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is inaccurate or unclear?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction or official source
