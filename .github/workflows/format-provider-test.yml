name: Format provider test

on:
  push:
    branches:
      - fix/elevenlabs-voice-and-platform-docs

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/elevenlabs-voice-and-platform-docs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/unit/elevenlabs-conversation-access.test.ts
      - name: Commit formatter result
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/elevenlabs-conversation-access.test.ts
          git commit -m "style: format ElevenLabs provider test"
          git push origin HEAD:fix/elevenlabs-voice-and-platform-docs
