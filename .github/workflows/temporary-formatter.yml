name: Temporary branch formatter

on:
  push:
    branches:
      - feat/flagship-product-experience

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write 'app/(marketing)/architecture/page.tsx' components/demo/demo-studio.tsx tests/e2e/demo-flow.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(marketing)/architecture/page.tsx' components/demo/demo-studio.tsx tests/e2e/demo-flow.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply repository formatter [skip ci]"
          git push
