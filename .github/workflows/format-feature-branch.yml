name: Format feature branch

on:
  push:
    branches:
      - fix/elevenlabs-voice-and-platform-docs

permissions:
  contents: write

concurrency:
  group: format-voice-platform-branch
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/elevenlabs-voice-and-platform-docs
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed product files
        run: >-
          npx prettier --write
          app/operations/page.tsx
          app/platform/page.tsx
          components/ui/navbar.tsx
          docs/product/customer-operations-function-catalog.md
          lib/elevenlabs/conversation-access.ts
          tests/e2e/platform-architecture.spec.ts
          tests/unit/elevenlabs-conversation-access.test.ts
          tests/unit/voice-bootstrap.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             app/operations/page.tsx             app/platform/page.tsx             components/ui/navbar.tsx             docs/product/customer-operations-function-catalog.md             lib/elevenlabs/conversation-access.ts             tests/e2e/platform-architecture.spec.ts             tests/unit/elevenlabs-conversation-access.test.ts             tests/unit/voice-bootstrap.test.ts
          git commit -m "style: format voice and platform changes"
          git push origin HEAD:fix/elevenlabs-voice-and-platform-docs
