name: Temporary improvement formatter

on:
  push:
    branches:
      - codex/voxdesk-finalization
    paths:
      - .github/workflows/format-improvement.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/voxdesk-finalization
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write lib/improvement/lifecycle.ts app/api/improvement tests/unit/improvement-lifecycle.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/improvement/lifecycle.ts app/api/improvement tests/unit/improvement-lifecycle.test.ts
          git commit -m "style(improvement): apply prettier"
          git push
