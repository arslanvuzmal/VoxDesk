name: Format Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply canonical formatting
        run: |
          npx prettier --write \
            "app/api/conversations/text/route.ts" \
            "app/api/webhooks/telnyx/voice/route.ts" \
            "lib/telephony/handoffs/project-handoff-event.ts" \
            "tests/e2e/demo-flow.spec.ts" \
            "tests/security/handoff-destination-authorization.test.ts" \
            "tests/unit/handoff-initiation.test.ts" \
            "tests/unit/handoff-projection.test.ts"
          git add -- \
            "app/api/conversations/text/route.ts" \
            "app/api/webhooks/telnyx/voice/route.ts" \
            "lib/telephony/handoffs/project-handoff-event.ts" \
            "tests/e2e/demo-flow.spec.ts" \
            "tests/security/handoff-destination-authorization.test.ts" \
            "tests/unit/handoff-initiation.test.ts" \
            "tests/unit/handoff-projection.test.ts"
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply canonical formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
