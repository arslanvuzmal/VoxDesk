name: Temporary consolidation formatter

on:
  push:
    branches:
      - codex/voxdesk-finalization
    paths:
      - .github/workflows/format-consolidation.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/voxdesk-finalization
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/api/analytics/route.ts app/(auth)/login/page.tsx app/(dashboard)/dashboard/leads/[id]/page.tsx README.md docs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md docs
          git commit -m "style: format consolidated product surfaces and docs"
          git push
