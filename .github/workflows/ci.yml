name: VoxDesk CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**', 'feat/**', 'fix/**', 'docs/**', 'refactor/**', 'security/**', 'test/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Temporary formatter permission is scoped to the branch quality job below.

concurrency:
  group: voxdesk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voxdesk?schema=public
  NEXT_TELEMETRY_DISABLED: 1
  AUTH_SECRET: ci-only-auth-secret-not-used-outside-validation
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  INTERNAL_API_SECRET: ci-only-internal-secret-not-used-outside-validation
  DEMO_SESSION_SECRET: ci-only-demo-session-secret-not-used-outside-validation
  IP_HASH_SECRET: ci-only-ip-hash-secret-not-used-outside-validation
  PHONE_HASH_SECRET: ci-only-phone-hash-secret-not-used-outside-validation

jobs:
  quality:
    name: Repository validation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format branch-only UX files
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/flagship-product-experience'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx prettier --write 'app/(marketing)/architecture/page.tsx' components/demo/demo-studio.tsx tests/e2e/demo-flow.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(marketing)/architecture/page.tsx' components/demo/demo-studio.tsx tests/e2e/demo-flow.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: apply repository formatter [skip ci]'
          git push
      - run: npx prisma validate
      - run: npm run format:check
      - run: npm run docs:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit:routes

  tests:
    name: Unit, integration, and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:security

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
