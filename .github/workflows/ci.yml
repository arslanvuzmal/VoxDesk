name: VoxDesk CI Pipeline

on:
  push:
    branches: [ main, fix/*, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build & Test Verification
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voxdesk?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/voxdesk?schema=public
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Check Formatting
        run: npm run format:check

      - name: Lint Codebase
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Run Security Tests
        run: npm run test:security

      - name: Audit Routes
        run: npm run audit:routes

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://voxdesk-ai.vercel.app