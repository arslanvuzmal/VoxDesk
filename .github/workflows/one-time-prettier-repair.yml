name: One-time Prettier repair

on:
  push:
    branches:
      - fix/metadata-application-url

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/metadata-application-url
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format focused files
        run: npx prettier --write lib/config/application-url.ts lib/config/env.ts tests/unit/application-url.test.ts tests/security/production-security-config.test.ts
      - name: Commit formatted files and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-prettier-repair.yml
          git add lib/config/application-url.ts lib/config/env.ts tests/unit/application-url.test.ts tests/security/production-security-config.test.ts
          git commit -m "style: apply repository formatting"
          git push origin HEAD:fix/metadata-application-url
