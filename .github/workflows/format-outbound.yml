name: Temporary outbound formatter

on:
  push:
    branches:
      - codex/voxdesk-finalization
    paths:
      - .github/workflows/format-outbound.yml
      - lib/telephony/outbound/elevenlabs-sip-executor.ts
      - tests/integration/outbound-job-worker.test.ts

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(outbound): apply prettier')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/voxdesk-finalization
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write lib/telephony/outbound/elevenlabs-sip-executor.ts tests/integration/outbound-job-worker.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/telephony/outbound/elevenlabs-sip-executor.ts tests/integration/outbound-job-worker.test.ts
          git commit -m "style(outbound): apply prettier"
          git push
