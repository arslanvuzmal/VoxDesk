<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">VoxDesk customer operations architecture</title>
  <desc id="desc">Phone, web voice, and web text converge into a canonical conversation, pass through context, orchestration, policy and authority controls, and produce customer operations with audit and quality evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60a5fa"/></marker>
    <style>
      .label{font:600 15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.12em;fill:#93c5fd}
      .title{font:700 28px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc}
      .body{font:500 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#cbd5e1}
      .small{font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#bae6fd}
      .card{fill:#101b2d;stroke:#334155;stroke-width:1.5}
      .flow{fill:none;stroke:#60a5fa;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="700" rx="28" fill="url(#bg)"/>
  <path d="M70 105H1210M70 595H1210" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="5 9"/>
  <text x="70" y="70" class="label">AI CUSTOMER OPERATIONS INFRASTRUCTURE</text>
  <text x="70" y="112" class="title">Conversation becomes authorized business state</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="220" height="320" rx="18" class="card"/>
    <text x="96" y="210" class="label">CHANNELS</text>
    <g class="body">
      <rect x="94" y="238" width="172" height="58" rx="12" fill="#172554" stroke="#2563eb"/><text x="180" y="273" text-anchor="middle">Phone</text>
      <rect x="94" y="316" width="172" height="58" rx="12" fill="#172554" stroke="#2563eb"/><text x="180" y="351" text-anchor="middle">Web voice</text>
      <rect x="94" y="394" width="172" height="58" rx="12" fill="#172554" stroke="#2563eb"/><text x="180" y="429" text-anchor="middle">Web text</text>
    </g>

    <rect x="365" y="170" width="280" height="320" rx="18" class="card"/>
    <text x="391" y="210" class="label">CANONICAL CORE</text>
    <rect x="391" y="238" width="228" height="86" rx="14" fill="url(#core)"/>
    <text x="505" y="272" class="small" text-anchor="middle" fill="#fff">CONVERSATION</text>
    <text x="505" y="298" class="body" text-anchor="middle" fill="#fff">tenant · customer · channel</text>
    <rect x="391" y="345" width="228" height="106" rx="14" fill="#0f2942" stroke="#0891b2"/>
    <text x="505" y="379" class="small" text-anchor="middle">CONTEXT + ORCHESTRATION</text>
    <text x="505" y="407" class="body" text-anchor="middle">intent · state · specialist</text>
    <text x="505" y="431" class="body" text-anchor="middle">knowledge · safe tool request</text>

    <rect x="720" y="170" width="230" height="320" rx="18" class="card"/>
    <text x="746" y="210" class="label">AUTHORITY</text>
    <g class="body">
      <rect x="744" y="238" width="182" height="52" rx="11" fill="#172554" stroke="#3b82f6"/><text x="835" y="270" text-anchor="middle">Schema + context</text>
      <rect x="744" y="308" width="182" height="52" rx="11" fill="#1f2937" stroke="#f59e0b"/><text x="835" y="340" text-anchor="middle">Policy decision</text>
      <rect x="744" y="378" width="182" height="52" rx="11" fill="#052e2b" stroke="#10b981"/><text x="835" y="410" text-anchor="middle">Idempotent execution</text>
    </g>

    <rect x="1025" y="170" width="185" height="320" rx="18" class="card"/>
    <text x="1051" y="210" class="label">OPERATIONS</text>
    <g class="body" text-anchor="middle">
      <text x="1118" y="260">CRM</text><text x="1118" y="302">Scheduling</text><text x="1118" y="344">Follow-up</text><text x="1118" y="386">Campaigns</text><text x="1118" y="428">Handoff</text>
    </g>
  </g>

  <path d="M290 330H365" class="flow"/><path d="M645 330H720" class="flow"/><path d="M950 330H1025" class="flow"/>
  <path d="M505 490V550H1118V490" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 6"/>
  <g transform="translate(365 550)">
    <rect width="585" height="76" rx="16" fill="#0c4a6e" stroke="#22d3ee"/>
    <text x="292" y="31" class="small" text-anchor="middle">AUDIT + RECONCILIATION + QUALITY</text>
    <text x="292" y="56" class="body" text-anchor="middle">Every allowed, denied, escalated and completed operation leaves evidence.</text>
  </g>
  <text x="70" y="660" class="small">MODEL MAY PROPOSE</text>
  <text x="640" y="660" class="small" text-anchor="middle">DOMAIN SYSTEM DECIDES</text>
  <text x="1210" y="660" class="small" text-anchor="end">DOMAIN SERVICE MUTATES</text>
</svg>
