<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">VoxDesk channel normalization</title><desc id="desc">Phone, web voice and web text normalize into one canonical Conversation while a Call remains a phone-specific projection.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker><style>.t{font:700 18px ui-sans-serif,system-ui;fill:#0f172a}.s{font:500 14px ui-sans-serif,system-ui;fill:#475569}.m{font:700 12px ui-monospace,monospace;fill:#1d4ed8;letter-spacing:.08em}.c{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.l{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="500" rx="22" fill="#f8fafc"/>
  <text x="54" y="58" class="t">Channel detail stops at the adapter boundary</text>
  <g transform="translate(60 105)"><rect width="220" height="82" rx="14" class="c"/><text x="110" y="34" class="m" text-anchor="middle">PHONE</text><text x="110" y="60" class="s" text-anchor="middle">Telnyx / PSTN / SIP</text></g>
  <g transform="translate(60 209)"><rect width="220" height="82" rx="14" class="c"/><text x="110" y="34" class="m" text-anchor="middle">WEB VOICE</text><text x="110" y="60" class="s" text-anchor="middle">ElevenLabs realtime</text></g>
  <g transform="translate(60 313)"><rect width="220" height="82" rx="14" class="c"/><text x="110" y="34" class="m" text-anchor="middle">WEB TEXT</text><text x="110" y="60" class="s" text-anchor="middle">Authenticated text turns</text></g>
  <path d="M280 146C385 146 385 248 480 248M280 250H480M280 354C385 354 385 252 480 252" class="l"/>
  <g transform="translate(500 156)"><rect width="280" height="188" rx="18" fill="#172554" stroke="#3b82f6" stroke-width="2"/><text x="140" y="43" class="m" text-anchor="middle" fill="#bfdbfe">CANONICAL CONVERSATION</text><text x="140" y="80" class="s" text-anchor="middle" fill="#e2e8f0">workspace · business · contact</text><text x="140" y="109" class="s" text-anchor="middle" fill="#e2e8f0">agent · channel · direction</text><text x="140" y="138" class="s" text-anchor="middle" fill="#e2e8f0">language · status · state</text></g>
  <path d="M640 156V98H930" class="l"/><g transform="translate(950 60)"><rect width="190" height="78" rx="13" fill="#eff6ff" stroke="#60a5fa"/><text x="95" y="33" class="m" text-anchor="middle">CALL</text><text x="95" y="57" class="s" text-anchor="middle">phone projection</text></g>
  <path d="M780 250H910" class="l"/><g transform="translate(930 165)"><rect width="210" height="170" rx="16" class="c"/><text x="105" y="35" class="m" text-anchor="middle">SHARED DOWNSTREAM</text><text x="105" y="70" class="s" text-anchor="middle">policy + tools</text><text x="105" y="99" class="s" text-anchor="middle">CRM + scheduling</text><text x="105" y="128" class="s" text-anchor="middle">handoff + evaluation</text></g>
  <text x="600" y="447" class="m" text-anchor="middle">ONE OPERATIONAL MODEL · CHANNEL-SPECIFIC PROJECTIONS</text>
</svg>
