<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">VoxDesk provider boundaries</title><desc id="desc">VoxDesk owns canonical business state, authorization, CRM, campaigns and audit. ElevenLabs owns realtime conversational execution when configured. Telnyx owns PSTN and SIP transport when configured. Simulation exercises internal contracts without provider calls.</desc>
  <defs><style>.h{font:700 22px ui-sans-serif,system-ui;fill:#0f172a}.k{font:700 12px ui-monospace,monospace;letter-spacing:.08em;fill:#1e40af}.b{font:500 14px ui-sans-serif,system-ui;fill:#475569}.c{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}</style></defs>
  <rect width="1200" height="560" rx="24" fill="#f8fafc"/>
  <text x="52" y="58" class="h">Providers transport conversations; VoxDesk owns business state</text>
  <g transform="translate(60 110)"><rect width="620" height="350" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="32" y="43" class="k">VOXDESK DOMAIN</text><g class="b"><text x="32" y="91">Canonical Conversation + Call projection</text><text x="32" y="130">Tenant context + signed tool authority</text><text x="32" y="169">CRM + appointments + tasks + handoffs</text><text x="32" y="208">Campaign consent + suppression + windows</text><text x="32" y="247">Provider event inbox + reconciliation</text><text x="32" y="286">Safe audit evidence + supervised quality</text></g><rect x="32" y="310" width="556" height="1" fill="#93c5fd"/><text x="32" y="336" class="k">SOURCE OF TRUTH FOR CUSTOMER OPERATIONS</text></g>
  <g transform="translate(750 110)"><rect width="390" height="100" rx="16" class="c"/><text x="26" y="36" class="k">ELEVENLABS ADAPTER</text><text x="26" y="66" class="b">Realtime conversation + post-call signals</text><text x="26" y="88" class="b">when authorized resources are configured</text></g>
  <g transform="translate(750 234)"><rect width="390" height="100" rx="16" class="c"/><text x="26" y="36" class="k">TELNYX ADAPTER</text><text x="26" y="66" class="b">PSTN / SIP + carrier events</text><text x="26" y="88" class="b">live mode fails closed without configuration</text></g>
  <g transform="translate(750 358)"><rect width="390" height="102" rx="16" fill="#ecfdf5" stroke="#10b981"/><text x="26" y="36" class="k" fill="#047857">SIMULATION PROVIDER</text><text x="26" y="66" class="b">Explicit sim_* identifiers; no network call</text><text x="26" y="88" class="b">never enters public provider webhooks</text></g>
  <path d="M680 170H750M680 284H750M680 408H750" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="600" y="514" class="k" text-anchor="middle">ADAPTER STATE IS RECONCILED INTO CANONICAL BUSINESS STATE</text>
</svg>
